<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Servizio</title>

  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding-top: 40px;
      background-color: #f7f7f7;
    }

    /* Logo ritagliato */
    .logo {
      width: 260px;
      margin-bottom: 30px;
    }

    /* Pulsante */
    .btn {
      display: inline-block;
      padding: 15px 30px;
      font-size: 20px;
      background-color: #0078ff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.25s ease;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.15);
    }

    /* Effetto hover */
    .btn:hover {
      background-color: #005fcc;
      transform: scale(1.05);
      box-shadow: 0px 6px 14px rgba(0,0,0,0.25);
    }
  </style>
</head>

<body>

  <!-- Logo ritagliato -->
  <img src="logo.jpg" alt="Logo" class="logo">

  <!-- Pulsante -->
  <a href="offerta.jpeg" target="_blank" class="btn">
    Clicca qui per accettare il servizio selezionato
  </a>

</body>
</html>
